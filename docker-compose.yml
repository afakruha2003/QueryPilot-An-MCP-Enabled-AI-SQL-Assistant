services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: querypilot
      POSTGRES_USER: querypilot
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - querypilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querypilot -d querypilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  querypilot-postgres:
